name: Build Active 2 Companion

on:
  push:
    branches: [main]
    paths:
      - "watch/**"
      - ".github/workflows/watch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: active2-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: watch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Zepp dependencies
        run: npm install --no-audit --no-fund

      - name: Build Active 2 ZAB
        run: npm run build

      - name: Upload Active 2 package
        uses: actions/upload-artifact@v4
        with:
          name: TrainingHub-Active2
          path: watch/dist/*.zab
          if-no-files-found: error
          retention-days: 90
